{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block body %}
<h1>Register for Study Tracker</h1>
<p>Track your study sessions and progress with ease.</p>

<form method="post" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" value="{{ request.form.get('name', '') }}" required>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="{{ request.form.get('email', '') }}" required>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required> <!-- add confirm password? !-->
    <label for="activation_key">Activation Key:</label>
    <input type="text" id="activation_key" name="activation_key" value="{{ request.form.get('activation_key', '') }}" required>

    <button type="submit">Register</button>
</form>
{% endblock %}
