{% macro post_button(action, label, icon) %}
<form method="post" action="{{ action }}" class="inline-form">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <button type="submit" title="{{ label }}" aria-label="{{ label }}">{{ icon }}</button>
</form>
{% endmacro %}

{% macro icon(name) %}{% include "icons/" + name + ".svg" %}{% endmacro %}
